name: Test UI Compatibility

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
        pygame-version: ["pygame==2.5.2", "pygame==2.6.0"]
        psychopy-version: ["PsychoPy==2024.1.2", "PsychoPy==2023.2.3"]
        numpy-version: ["numpy==1.23.5", "numpy==1.26.4", "numpy>=2.0.0"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel
        pip install ${{ matrix.numpy-version }}
        pip install ${{ matrix.pygame-version }}
        pip install ${{ matrix.psychopy-version }} || true
        pip install pytest opencv-python-headless
        
    - name: Run UI tests
      shell: bash
      run: |
        pytest test/test_version_compat.py
